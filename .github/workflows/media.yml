# Deploys public/media/ to Cloudflare (cloudflare/media/) when the files change. Vercel serves the same folder as the
# fallback, so nothing else is needed. Uses the repo secrets CLOUDFLARE_API_TOKEN (Workers Scripts: Edit) and
# CF_ACCOUNT_ID; until the token exists the job only leaves a note, and `npm run media:deploy` deploys by hand.
name: Media to Cloudflare

on:
  push:
    branches: [main]
    paths: ["public/media/**", "cloudflare/media/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: media
  cancel-in-progress: true

jobs:
  media:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN isn't set, so media wasn't deployed. Run npm run media:deploy."
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/checkout@v4
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4 deploy --config cloudflare/media/wrangler.jsonc
