# Keeps the agent's FAISS index in sync with content/, then evaluates the agent.
name: Agent index + evals

on:
  push:
    branches: [main]
    # Everything on the chat's path, not only the agent: the gateway routes and the agent client are part of it.
    paths: ["content/**", "agent/**", "evals/**", "api/**", "lib/server/**", "app/api/**", "scripts/build-content.ts",
            "requirements*.txt", ".github/workflows/agent.yml"]
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 1" # every Monday, 09:00 IST

permissions:
  contents: write # to commit a rebuilt index

concurrency:
  group: agent
  cancel-in-progress: false # queue, don't cancel: a cancelled run has already spent model calls and tested nothing

jobs:
  agent:
    runs-on: ubuntu-latest
    env:
      # CI never spends the site's daily quotas. No Groq key (its daily token cap is the site's best capacity) and no
      # Gemini or Cloudflare keys (their daily quotas reset at 13:30 and 05:30 IST, and a Monday-morning run used to
      # empty them for the visitors that followed). The evals run on NVIDIA's API catalog instead: free, rate-limited
      # per minute, no daily cap. Embeddings are built locally.
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      # Optional: a Gemini key from a CI-only Google project (its own free quota), for the RAGAS judge and more models.
      GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY_CI }}
      # Optional: with the site's Redis, CI's calls are booked in the same per-minute pool the visitors use.
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: pip install -r requirements-dev.txt

      - name: Rebuild knowledge, FAISS index, scope bank and answer bank (each skips itself if nothing changed)
        run: npm run content && python -m agent.build_index && python -m agent.build_answers

      - name: Difficulty levels (rules, no API calls)
        run: python -m evals.difficulty_eval

      - name: Navigation (rules, no API calls)
        run: python -m evals.navigation_eval

      - name: Groq smoke test (2 questions, ~1% of each model's daily quota)
        # The only step with the Groq key: it shares the site's quota, so the full evals below never use Groq.
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m evals.groq_smoke

      - name: Refusal pipeline (attacks must be refused with 0 leaks, recruiters' questions never)
        run: python -m evals.scope_eval --full

      - name: Agent evals (retrieval, facts, guardrails)
        run: python -m evals.run_evals

      - name: Selling by showing (takes the visitor to the right proof unasked, stays put when it should, replies stay short)
        run: python -m evals.showing_eval

      - name: Recruiter cases (he is sold, honestly — proof, links, a next step, no invented gaps)
        run: python -m evals.advocacy_eval

      - name: Commit the agent data and the eval baseline if they changed (Vercel then redeploys)
        # Only after every eval above passed: a failing eval keeps the new index and answer bank off the site, and the
        # baseline (evals/baseline.json: the cases that must keep passing) only ever grows on a green run.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent/data evals/baseline.json
          # Rebase first: a push to main can land while this job runs (the push would otherwise be rejected).
          git diff --cached --quiet || (git commit -m "Rebuild agent index, extend the eval baseline" && git pull --rebase origin main && git push)

      - name: RAGAS (faithfulness, answer relevancy, context precision)
        # Weekly / manual only, and only with the CI-only Gemini key: the judge is a Gemini model.
        if: github.event_name != 'push' && env.GOOGLE_GENERATIVE_AI_API_KEY != ''
        run: python -m evals.ragas_eval
        continue-on-error: true # the free judge model can rate-limit

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: |
            evals/results.jsonl
            evals/ragas_results.csv
