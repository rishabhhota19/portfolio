# Keeps the agent's FAISS index in sync with content/, then evaluates the agent.
name: Agent index + evals

on:
  push:
    branches: [main]
    paths: ["content/**", "agent/**", "evals/**", "scripts/build-content.ts", "requirements*.txt"]
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 1" # every Monday, 09:00 IST

permissions:
  contents: write # to commit a rebuilt index

concurrency:
  group: agent
  cancel-in-progress: true

jobs:
  agent:
    runs-on: ubuntu-latest
    env:
      # No Groq key here on purpose: Groq's daily token cap is the site's best capacity, so CI uses Gemini + Cloudflare.
      GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }} # Cloudflare chat models (embeddings are built locally)
      CF_WORKERS_AI_TOKEN: ${{ secrets.CF_WORKERS_AI_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: pip install -r requirements-dev.txt

      - name: Rebuild knowledge, FAISS index, scope bank and answer bank (each skips itself if nothing changed)
        run: npm run content && python -m agent.build_index && python -m agent.build_answers

      - name: Commit the agent data if it changed (Vercel then redeploys)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent/data
          # Rebase first: a push to main can land while this job runs (the push would otherwise be rejected).
          git diff --cached --quiet || (git commit -m "Rebuild agent index" && git pull --rebase origin main && git push)

      - name: Difficulty levels (rules, no API calls)
        run: python -m evals.difficulty_eval

      - name: Navigation (rules, no API calls)
        run: python -m evals.navigation_eval

      - name: Groq smoke test (2 questions, ~1% of each model's daily quota)
        # The only step with the Groq key: it shares the site's quota, so the full evals below never use Groq.
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m evals.groq_smoke

      - name: Refusal pipeline (attacks must be refused with 0 leaks, recruiters' questions never)
        run: python -m evals.scope_eval --full

      - name: Agent evals (retrieval, facts, guardrails)
        run: python -m evals.run_evals

      - name: RAGAS (faithfulness, answer relevancy, context precision)
        # Weekly / manual only: the judge shares the site's free Gemini quota, so don't spend it on every push.
        if: github.event_name != 'push'
        run: python -m evals.ragas_eval
        continue-on-error: true # the free judge model can rate-limit

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: |
            evals/results.jsonl
            evals/ragas_results.csv
