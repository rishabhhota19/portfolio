# Writer bench (evals/writer_bench.py): how a model does as the one that writes Dumbledore's answers, on the recruiter
# cases and a spread of facts. It runs here because the Groq key lives only in these secrets and on Vercel. Manual
# only: it shares Groq's free quota with the site, and two models use nearly 100,000 tokens each of their 200,000 a
# day (14 Nov 2026: 98,180 and 95,203), so run it on a quiet day and not twice.
name: Writer bench

on:
  workflow_dispatch:
    inputs:
      models:
        description: Model names from agent/llm.py, space-separated
        default: groq-qwen groq-120b

permissions:
  contents: read

concurrency:
  group: writer-bench
  cancel-in-progress: false # a cancelled run has already spent model calls

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }} # the research planner's lead model, as in production
      MODELS: ${{ inputs.models || 'groq-qwen groq-120b' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Bench the models as the writer
        run: python -m evals.writer_bench $MODELS
